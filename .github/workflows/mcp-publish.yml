name: Publish MCP server

# Builds the MCP server image from mcp/Dockerfile, pushes it to
# ghcr.io/alexgaoth/reverse-engineered-mcp:<version> and :latest, and publishes
# mcp/server.json to the official MCP Registry (registry.modelcontextprotocol.io).
# The version comes from mcp/server.json. To release a new version, change the
# version and the image tag in mcp/server.json, then run this workflow or push
# the tag mcp-v<version>.
#
# Registry login uses GitHub OIDC (io.github.alexgaoth/* namespace): no token
# or secret. The registry checks the image label, so the GHCR package must be
# public. New GHCR packages are private: after the first push, set the package
# to public once (Package settings > Change visibility), then run with
# registry=true.

on:
  workflow_dispatch:
    inputs:
      registry:
        description: "Also publish server.json to the MCP Registry"
        type: boolean
        default: true
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # push to ghcr.io
      id-token: write   # MCP Registry login (OIDC)
    env:
      IMAGE: ghcr.io/alexgaoth/reverse-engineered-mcp
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@v5

      - name: Read version
        id: v
        run: |
          v=$(jq -r .version mcp/server.json)
          id=$(jq -r '.packages[0].identifier' mcp/server.json)
          [ "$id" = "$IMAGE:$v" ] || { echo "::error::server.json identifier is $id, expected $IMAGE:$v"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "mcp-v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match server.json version $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t "$IMAGE:${{ steps.v.outputs.version }}" -t "$IMAGE:latest" mcp

      - name: Smoke test (MCP initialize over stdio)
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | docker run -i --rm "$IMAGE:${{ steps.v.outputs.version }}" | head -n 1 | jq -e '.result.serverInfo.name'

      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags "$IMAGE"

      - name: Install cosign
        if: github.event_name == 'push' || inputs.registry
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        if: github.event_name == 'push' || inputs.registry
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Publish to the MCP Registry
        if: github.event_name == 'push' || inputs.registry
        run: |
          ./mcp-publisher validate mcp/server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish mcp/server.json
