name: Weekly digest

# Every Monday, publishes a GitHub Release with this week's additions, the
# projects that gained the most stars, and archived or removed repos. The
# star snapshot (stars.json) is attached to each release, and the next run
# downloads it from the latest release to compute "Rising this week".
# Watchers get a notification; /releases.atom is the RSS feed.

on:
  schedule:
    - cron: "30 14 * * 1"   # Monday 14:30 UTC, after the nightly refresh has merged
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Previous snapshot
        run: |
          mkdir -p prev
          if ! gh release download --pattern stars.json --dir prev 2>/dev/null; then
            # First run: no digest release yet. Use data/entries.json as it was 7 days ago.
            since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits?path=data/entries.json&until=$since&per_page=1" -q '.[0].sha')
            if [ -n "$sha" ]; then
              gh api -H "Accept: application/vnd.github.raw" "repos/$GITHUB_REPOSITORY/contents/data/entries.json?ref=$sha" > prev/stars.json
            else
              echo "no previous snapshot"
            fi
          fi

      - name: Build digest
        run: python3 scripts/digest.py prev/stars.json out

      - name: Publish release
        run: |
          d=$(date -u +%Y-%m-%d)
          gh release create "digest-$d" out/stars.json \
            --title "This week in reverse engineering: $d" \
            --notes-file out/notes.md --latest
