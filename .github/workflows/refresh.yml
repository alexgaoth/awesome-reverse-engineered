name: Nightly refresh

# Re-checks every entry against the GitHub API (stars, archived state,
# renames, language, license, topics), removes repos that no longer exist,
# re-renders the Markdown pages, and lands the result as a squash-merged PR.
#
# Token: uses the REFRESH_TOKEN secret if set (a fine-grained PAT with
# Contents + Pull requests read/write on this repo, so PRs are authored by
# the owner), else the built-in GITHUB_TOKEN. With GITHUB_TOKEN, enable
# Settings > Actions > General > "Allow GitHub Actions to create and approve
# pull requests".

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKEN: ${{ secrets.REFRESH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.REFRESH_TOKEN || github.token }}

      - name: Refresh data from GitHub
        env:
          GITHUB_TOKEN: ${{ env.TOKEN }}
        run: python3 scripts/refresh.py

      - name: Render Markdown
        run: python3 scripts/render.py

      - name: Open and merge PR
        env:
          GH_TOKEN: ${{ env.TOKEN }}
        run: |
          if git diff --quiet -- data README.md README.zh-CN.md README.fr.md README.es.md categories assets docs; then
            echo "No changes."
            exit 0
          fi
          branch="bot/refresh-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data README*.md categories assets docs plugin .claude-plugin mcp
          git commit -q -m "Nightly refresh $(date -u +%Y-%m-%d)"
          git push -q origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Nightly refresh $(date -u +%Y-%m-%d)" --body-file refresh-summary.md
          gh pr merge "$branch" --squash --delete-branch
