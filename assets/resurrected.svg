<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<style>
.k{font:600 30px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#ffb000} .t{font:700 84px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#f2f0e8;letter-spacing:-2.5px}
.s{font:400 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#a8a597} .u{font:600 26px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#f2f0e8}
.x{font:700 34px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#f87171} .ok{font:700 34px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;fill:#4ade80}
</style>
<rect width="1280" height="640" fill="#0e0f0d"/>
<path d="M880 560 V250 a150 150 0 0 1 300 0 V560 Z" fill="#151613" stroke="#2a2b26" stroke-width="3"/>
